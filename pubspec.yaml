name: sakhi_safety
description: Women's safety app prototype (SOS, offline BLE relay, auto-detect, safety heat map).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.32.0        # BLE scanning (listen for distress packets)
  flutter_ble_peripheral: ^1.2.0    # BLE advertising (broadcast distress packet)
  permission_handler: ^11.3.0
  connectivity_plus: ^6.0.0         # detect network loss
  sensors_plus: ^6.0.0              # detect impact / fall
  url_launcher: ^6.2.0              # call 112, open SMS composer
  google_fonts: ^6.2.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  flutter_foreground_task: ^10.0.0
  flutter_local_notifications: ^17.2.3
  http: ^1.2.2
  csv: ^6.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
